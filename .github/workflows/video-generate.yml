name: Generate Video Manually

on:
  workflow_dispatch: # This makes the workflow run manually, no cron job

jobs:
  run-video-generation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          # Dependencies analyzed from project files
          pip install supabase python-dotenv requests imageio-ffmpeg moviepy google-genai pydantic fish-audio-sdk

      - name: Run Main Script
        env:
          # Make sure to configure your GitHub repository secrets for these
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python main.py
